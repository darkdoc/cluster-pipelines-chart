suite: Test hypershift pipelines
templates:
  - templates/pipelines/standard-pipelines.yaml
release:
  name: release-test
tests:
  - it: should output correct amount of pipelines
    documentSelector:
      path: metadata.labels["pattern.name"]
      value: hypershift
      matchMany: true
    isKind:
      of: Pipeline
    asserts:
      - hasDocuments:
          count: 16 # 3 * 4 * 2 - 2 * 4 * 1  (platform * versions * flavors) (hosted is only available on aws)
          filterAware: true
